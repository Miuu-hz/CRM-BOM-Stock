<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F6FB">
<title>สั่งอาหาร</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* หน้าลูกค้าสั่งที่โต๊ะ — layout ตามต้นแบบ "สั่งที่โต๊ะ QR Menu", สี/ฟอนต์ตาม frontend/src/index.css ของ ERP
   ไม่ใช้ Tailwind/React ของระบบหลัก: เปิดจากมือถือลูกค้าบนเน็ตมือถือ ต้องเบาที่สุด */
:root{
  --primary:#5B5CF0; --primary-press:#3D3EBE; --primary-soft:#EEEEFF; --on-primary:#FFFFFF;
  --mango:#F5A524; --success:#16A34A; --success-soft:#DCFCE7; --success-strong:#15803D;
  --warning-soft:#FEF3C7; --warning-strong:#B45309; --danger:#DC2626; --danger-soft:#FEE2E2; --danger-strong:#B91C1C;
  --bg:#F6F6FB; --surface:#FFFFFF; --surface-2:#F1F1F8; --border:#E6E6F0; --border-strong:#D5D5E3;
  --fg-1:#111114; --fg-2:#3A3A48; --fg-3:#6E6E82; --fg-4:#A3A3B5;
  --shadow-2:0 8px 24px -12px rgba(60,60,120,.18); --shadow-3:0 16px 40px -12px rgba(60,60,120,.24);
  --scrim:rgba(17,17,20,.55);
  --f-display:"Plus Jakarta Sans","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --primary:#7173F5; --primary-press:#6062E6; --primary-soft:rgba(113,115,245,.18);
    --success:#4ADE80; --success-soft:rgba(74,222,128,.14); --success-strong:#4ADE80;
    --warning-soft:rgba(251,191,36,.14); --warning-strong:#FBBF24; --danger:#F87171; --danger-soft:rgba(248,113,113,.14); --danger-strong:#F87171;
    --bg:#0C0C11; --surface:#15151D; --surface-2:#1D1D28; --border:#2A2A38; --border-strong:#3A3A4C;
    --fg-1:#F4F4FA; --fg-2:#D2D2E0; --fg-3:#8F8FA6; --fg-4:#5F5F75;
    --shadow-2:0 8px 24px -12px rgba(0,0,0,.7); --shadow-3:0 16px 40px -12px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg-1);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- header ---------- */
.head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.head .shop{flex:1;min-width:0}
.head .shop b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .shop span{font-size:12.5px;color:var(--fg-3)}
.table-chip{flex:none;font-family:var(--f-display);font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}

/* ---------- menu ---------- */
.body{flex:1;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.cats{position:sticky;top:var(--head-h,62px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--fg-2);min-height:36px}
.cats button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.cat-h{font-family:var(--f-display);font-weight:700;font-size:16px;padding:16px 16px 6px;scroll-margin-top:calc(var(--head-h,62px) + 56px)}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.tile{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--primary-soft);color:var(--primary);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.item.out .tile{background:var(--surface-2);color:var(--fg-4)}
.item.out .tile img{filter:grayscale(1);opacity:.55}
.item-name{font-weight:600;line-height:1.35}
.item-desc{font-size:12.5px;color:var(--fg-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{font-size:14px;color:var(--fg-2);font-weight:600;margin-top:2px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warning-soft);color:var(--warning-strong);white-space:nowrap}
.badge.out{background:var(--danger-soft);color:var(--danger-strong)}
.badge.ok{background:var(--success-soft);color:var(--success-strong)}
.badge.wait{background:var(--surface-2);color:var(--fg-3)}
.badge.cook{background:var(--primary-soft);color:var(--primary)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center;color:var(--fg-1)}
.stepper button.add{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.stepper button.add:active{background:var(--primary-press)}
.stepper .q{min-width:22px;text-align:center;font-weight:700}

/* ---------- bottom: cart bar + nav ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
.bottom > *{pointer-events:auto;max-width:560px;margin:0 auto}
.cartbar{display:flex;width:calc(100% - 24px);margin:0 auto 10px;border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);justify-content:space-between;align-items:center;padding:14px 18px;font-size:15px;font-weight:700;box-shadow:var(--shadow-3)}
.cartbar:active{background:var(--primary-press)}
.nav{display:grid;grid-template-columns:repeat(var(--tabs,2),1fr);border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;padding:10px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--fg-3);position:relative;min-height:56px}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--primary);font-weight:700}
.nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- cards (bill tab) ---------- */
.pad{padding:14px 16px;display:grid;gap:14px}
.h-sm{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--fg-2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:grid;gap:8px;box-shadow:0 1px 2px rgba(17,17,20,.04)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.row > :first-child{min-width:0}
.row.total{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--border)}
.muted{color:var(--fg-3)}
.small{font-size:12.5px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px dashed var(--border);align-items:center}
.line:first-child{border-top:0;padding-top:2px}
.line .nm{font-weight:600}
.note-in{grid-column:1/-1;width:100%;font-size:14px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
.banner{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--warning-soft);color:var(--warning-strong);font-weight:600}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;text-align:center;min-height:48px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-press)}
.btn.mango{background:var(--mango);border-color:var(--mango);color:#2A1A00}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-3);font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- full-screen states ---------- */
.state{flex:1;display:grid;align-content:center;justify-items:center;gap:14px;padding:48px 24px;text-align:center}
.state h1{font-family:var(--f-display);font-size:22px;line-height:1.3;margin:0}
.state p{margin:0;color:var(--fg-3);max-width:32ch}
.ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:800;background:var(--danger-soft);color:var(--danger-strong)}
.ico.ok{background:var(--success-soft);color:var(--success-strong)}
.ico.info{background:var(--primary-soft);color:var(--primary)}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toast + sheet ---------- */
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:40;max-width:528px;margin:0 auto;background:var(--fg-1);color:var(--bg);font-size:14px;padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.sheet-layer{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:92vh;overflow-y:auto;animation:up .22s ease-out}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0}
.sheet p{margin:0;font-size:14px;color:var(--fg-3)}
.sheet label{font-size:13.5px;font-weight:600}
.sheet input[type=tel],.sheet input[type=text]{width:100%;font-size:17px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400!important;font-size:13.5px;line-height:1.5;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--primary)}
.fine{font-size:12px;color:var(--fg-3)}
.err{font-size:13px;color:var(--danger-strong);min-height:1.2em}

/* ---------- สมาชิก ---------- */
.chip{flex:none;border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.pts{background:var(--warning-soft);color:var(--warning-strong)}
.chip.wait{background:var(--surface-2);color:var(--fg-3)}
.chip.join{background:var(--primary);color:var(--on-primary)}
.card.member{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.card.member .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.1}
.card.member small{opacity:.85;font-size:12.5px}
.card.earn{background:var(--success-soft);border-color:transparent;color:var(--success-strong);font-weight:600}
.plus{color:var(--success-strong);font-weight:700}
.minus{color:var(--danger-strong);font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
/* ---------- Pop-up โฆษณา: รูป 82% ของจอ ปุ่มปิดวงกลม 30px ใต้รูป พื้นที่กด 44px ไม่มีนับถอยหลัง ---------- */
.ad-layer{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 0;animation:fade .25s ease-out}
.ad-frame{width:82%;max-width:460px;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);border:0;padding:0}
.ad-frame img{width:100%;height:100%;object-fit:contain;display:block}
.ad-x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.ad-x span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.ad-x svg{width:12px;height:12px;stroke:#111114;stroke-width:2.4}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"><div class="state"><div class="spinner" role="status" aria-label="กำลังโหลด"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ad-layer" id="ad-layer" hidden role="dialog" aria-modal="true" aria-label="โปรโมชันจากร้าน">
  <button class="ad-frame" id="ad-frame" data-act="ad-tap" aria-label="ดูโปรโมชันนี้"></button>
  <button class="ad-x" data-act="ad-close" aria-label="ปิดโฆษณา"><span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" fill="none"/></svg></span></button>
</div>
<div class="sheet-layer" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div></div>
<noscript><div class="state"><h1>เปิด JavaScript ก่อนนะครับ</h1><p>หน้าสั่งอาหารต้องใช้ JavaScript</p></div></noscript>
<script src="/qr/app.js?v=1" defer></script>
</body>
</html>
